<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="screen active" id="start-screen">
            <h1>Quiz-Time!</h1>
            <p>Test yor knowledge with this fun question</p>
            <button class="start-btn">star Quiz</button>
            
        <div class="screen" id="quiz screen">
            <div class="header" >
                <h2 id="question-text">Question goes here</h2>
                <div class="quiz-info">
                    <p>Question<span id="current-questio">1</span>of <span>5</span></p>

                    <p>Score: <span id="score">0</span></p>
                </div>
            </div>
            
            <div id="answer-container" class="answer-container">
                <!--answers will be coded in JS here-->
            </div>

           <div class="progress-bar"></div>
            <div id="progress class="progress"></div>
        </div>  
        </div>
           
        <div class="result-screen" id="result-screen">
            <h1>Quiz-results</h1>
            <div class="result-info">
                <p>you scored <span id="final score">0</span> out of <span id="max-score">5</span></p>

                <div id="result-message">Good job!</div>
            </div>
            <button id="retart-btn">Restart-quiz</button>

        </div>
    </div>
    
</body>
</html>
