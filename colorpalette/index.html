<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color palette Generator</title>
    <link rel="stylesheet" href="<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
 
    <div class="container">
        <h1>Color palette Generator</h1>
        <button id="denera-btn">
            <i class="fas-sync-alt"></i>
            Generate palette
        </button>

        <div class="palette-container">
            <div class+"color-box">
                <div class="color" style="background-color: #e1f5fe;"></div>
                <div class="color-info"></div>
                <span class="hex-value">#E1F5FE</span>
                <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
            </div>
        </div>

        <div class="palette-container">
            <div class+"color-box">
                <div class="color" style="background-color: #1082b7;"></div>
                <div class="color-info"></div>
                <span class="hex-value">#E1F5FE</span>
                <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
            </div>
        </div>

        <div class="palette-container">
            <div class+"color-box">
                <div class="color" style="background-color: #e1f5;"></div>
                <div class="color-info"></div>
                <span class="hex-value">#E1F5FE</span>
                <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
            </div>
        </div>

        <div class="palette-container">
            <div class+"color-box">
                <div class="color" style="background-color: #5ea323;"></div>
                <div class="color-info"></div>
                <span class="hex-value">#E1F5FE</span>
                <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
            </div>
        </div>

        <div class="palette-container">
            <div class+"color-box">
                <div class="color" style="background-color: #ceb318;"></div>
                <div class="color-info"></div>
                <span class="hex-value">#E1F5FE</span>
                <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
            </div>
        </div>
    </div>
    <script src="script.css"></script>
</body>
</html>
